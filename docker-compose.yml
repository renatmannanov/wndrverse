services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wndrverse
      POSTGRES_PASSWORD: localpass
    ports:
      # Host 5434 → container 5432. 5434 to NOT collide with ayda (5433).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wndrverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # app service is not needed for the MVP (we run the pipeline locally with python).
  # Template kept (commented) to show where to grow toward a packaged deployment.
  # app:
  #   build: .
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://postgres:localpass@db:5432/wndrverse
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #     WNDR_EXPORTS_DIR: /data/exports
  #   volumes:
  #     - ./data:/data
  #   command: ["python", "-m", "delivery", "digest", "--topic", "offerings", "--period", "all"]

volumes:
  pgdata:
